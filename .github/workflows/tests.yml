name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q -p no:cacheprovider
  training-math:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' transformers==4.57.6 peft==0.18.1 accelerate==1.15.0
      - name: Require the training stack before pytest
        run: |
          python - <<'PY'
          import accelerate
          import peft
          import torch
          import transformers
          assert torch.__version__.split('+')[0] == '2.8.0'
          assert torch.version.cuda is None
          assert transformers.__version__ == '4.57.6'
          assert peft.__version__ == '0.18.1'
          assert accelerate.__version__ == '1.15.0'
          from transformers import GPT2LMHeadModel
          PY
      - name: Check CPU training math and sampler law
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_training.py tests/test_generation_config.py
          tests/test_financial_training.py tests/test_curriculum.py
