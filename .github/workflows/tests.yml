name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q -p no:cacheprovider
      - name: Replay published evidence without a training stack or raw data
        run: python scripts/replay_published_results.py
      - name: Recompute saved reliability and diversity diagnostics
        run: python scripts/replay_published_diagnostics.py
      - name: Replay the complete Astra bank and offline explorer
        run: python scripts/replay_published_astra.py
      - name: Replay the post-hoc pool diagnosis and its offline explorer
        run: python scripts/replay_published_astra_pool.py
      - name: Replay the complete matched-prefix revision bank and offline explorer
        run: python scripts/replay_published_astra_revision.py
  training-math:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' transformers==4.57.6 peft==0.18.1 accelerate==1.15.0
      - name: Require the training stack before pytest
        run: |
          python - <<'PY'
          import accelerate
          import peft
          import torch
          import transformers
          assert torch.__version__.split('+')[0] == '2.8.0'
          assert torch.version.cuda is None
          assert transformers.__version__ == '4.57.6'
          assert peft.__version__ == '0.18.1'
          assert accelerate.__version__ == '1.15.0'
          from transformers import GPT2LMHeadModel
          PY
      - name: Check CPU training math and sampler law
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_training.py tests/test_generation_config.py
          tests/test_financial_training.py tests/test_curriculum.py
          tests/test_linkage_training.py
