[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-rl"
version = "0.1.0"
description = "Reproducible, budgeted alpha-research environments and trainable research policies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
train = ["torch>=2.7", "transformers>=4.51,<5", "peft>=0.15", "accelerate>=1.5", "safetensors>=0.5"]
plots = ["matplotlib>=3.8"]
paper = ["reportlab>=4.4,<5"]

[project.scripts]
alpha-research = "alpha_research_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
